<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#242E60">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>المرحلة الرابعة | مبادرة نقلة ذكية</title>
<style>
@font-face{font-family:'SST Arabic';src: local('SST Arabic'), local('SST-Arabic'), local('SST Arabic Roman'), local('SSTArabic');font-weight:400 900;font-display:swap}
:root{--maroon:#894548;--navy:#242E60;--rose:#E6BBBB;--gold:#E1A864;--blue:#5F74A6;--bg:#FFF9F3;--card:#FFFFFF;--ink:#2f2a26;--border:#E6BBBB;--radius:16px;--shadow:0 10px 30px rgba(36,46,96,.12)}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:'SST Arabic', Tahoma, Arial, sans-serif;background:var(--bg);color:var(--ink);line-height:2.05;font-size:17px}
body::before{content:"";position:fixed;inset:0;z-index:0;background:url("صورة الكعبة ومنى.png") center 30% / min(1100px,95vw) no-repeat;opacity:.22;pointer-events:none}
body::after{content:"";position:fixed;inset:0;z-index:0;background:linear-gradient(180deg, rgba(255,249,243,.30), rgba(255,249,243,.50));pointer-events:none}
header, main, footer{position:relative;z-index:1}
.container{max-width:980px;margin:0 auto;padding:0 20px}
#progressBar{position:fixed;top:0;right:0;height:5px;width:0;z-index:200;background:linear-gradient(90deg,var(--blue),var(--rose),var(--gold))}
header{background:rgba(255,255,255,.96);border-bottom:2px solid var(--border);position:sticky;top:0;z-index:100;backdrop-filter:blur(10px)}
.nav{display:flex;align-items:center;gap:14px;padding:12px 0;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand img{height:54px;width:auto;display:block;background:#fff;border-radius:12px;padding:4px;border:1px solid var(--border)}
.brand .t b{display:block;font-size:20px;font-weight:900;color:var(--navy);line-height:1.4}
.brand .t small{color:var(--maroon);font-size:13px;line-height:1.7;display:block}
nav.links{margin-right:auto;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
nav.links a.tab{font-size:14px;font-weight:800;color:var(--navy);background:#FFF9F3;border:1px solid var(--border);padding:7px 16px;border-radius:999px;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
nav.links a.tab:hover,nav.links a.tab.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.drop{position:relative;display:flex}
.drop-menu{display:none;position:absolute;top:calc(100% + 8px);right:0;min-width:220px;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:6px;z-index:200}
.drop-menu a{display:block;padding:9px 14px;border-radius:8px;font-size:14px;font-weight:800;color:var(--navy);text-decoration:none}
.drop-menu a:hover{background:#E9EDF6}
.drop-menu a.active{background:var(--navy);color:#fff}
.drop.open .drop-menu{display:block}
@media (hover:hover){
  .drop:hover .drop-menu{display:block}
}
.drop::after{content:"";position:absolute;top:100%;right:0;left:0;height:14px;display:none;z-index:199}
.drop:hover::after{display:block}

.menu-btn{display:none;margin-right:auto;background:var(--navy);color:#fff;border:0;border-radius:10px;width:42px;height:42px;font-size:19px;cursor:pointer}
.caret{display:none;background:#FFF9F3;border:1px solid var(--border);color:var(--navy);border-radius:50%;width:34px;height:34px;font-size:13px;cursor:pointer;place-items:center;align-self:center;flex:0 0 auto;padding:0;font-family:inherit}
.caret:hover{background:var(--navy);color:#fff;border-color:var(--navy)}
.drop.open .caret{transform:rotate(180deg);background:var(--navy);color:#fff;border-color:var(--navy)}
.install-btn{width:42px;height:42px;border-radius:12px;background:#FFF9F3;border:1px solid var(--border);color:var(--navy);cursor:pointer;display:none;place-items:center;flex:0 0 auto;padding:0}
.install-btn.show{display:grid}
.install-btn:hover{background:var(--navy);color:#fff;border-color:var(--navy)}
.hero-compact{text-align:center;padding:42px 0 10px}
.hero-compact h1{font-size:clamp(30px,5vw,46px);margin:0 0 4px;color:var(--gold);font-weight:900}
.hero-compact .p1{font-size:clamp(18px,3vw,26px);color:var(--maroon);font-weight:900;margin:0}
.hero-compact .p2{font-size:clamp(15px,2.4vw,20px);color:var(--blue);font-weight:700;margin:4px auto 0;max-width:820px}
.card{background:var(--card);border:1px solid var(--border);border-top:5px solid var(--maroon);border-radius:var(--radius);box-shadow:var(--shadow);margin:18px 0;padding:30px;text-align:center}
.card h2{color:var(--navy);font-size:22px;margin:0 0 10px}
.card p{color:var(--maroon);font-weight:800;font-size:19px;margin:0}
footer{background:#FFFFFF;color:var(--navy);border-top:3px solid var(--gold);text-align:center;padding:18px;font-size:14px;margin-top:30px;font-weight:800}
#toTop{position:fixed;bottom:26px;left:26px;z-index:150;width:48px;height:48px;border:1px solid var(--border);border-radius:50%;background:rgba(255,255,255,.75);box-shadow:0 6px 18px rgba(36,46,96,.15);color:var(--navy);font-size:26px;font-weight:400;line-height:1;cursor:pointer;display:grid;place-items:center;opacity:0;visibility:hidden;transform:translateY(18px);transition:opacity .3s, transform .3s, visibility .3s}
#toTop.show{opacity:1;visibility:visible;transform:none}
#toTop:hover{transform:translateY(-3px);color:var(--maroon);background:rgba(255,255,255,.95)}
@media(max-width:860px){
  nav.links{display:none;width:100%;flex-direction:column;align-items:stretch}
  nav.links.open{display:flex}
  .menu-btn{display:block}
  .caret{display:grid}
  .drop{flex-direction:row;align-items:center;gap:6px;flex-wrap:wrap}
  .drop .tab{flex:1}
  .drop .drop-menu{flex:0 0 100%}
  .drop .tab{padding-left:48px}
  .drop .caret{position:absolute;left:8px;top:50%;transform:translateY(-50%);margin:0}
  .drop.open .caret{transform:translateY(-50%) rotate(180deg)}
  .drop-menu{position:static;display:none;flex-direction:column;box-shadow:none;border:0;background:transparent;padding:4px 16px 0 0}
  .drop.open .drop-menu{display:flex}
}
</style>
</head>
<body>
<div id="progressBar"></div>
<header>
  <div class="container nav">
    <div class="brand">
      <img src="شعار نقلة ذكية.png" alt="شعار نقلة ذكية">

    </div>
    <button class="menu-btn" id="menuBtn" aria-label="القائمة">☰</button>
    <button class="install-btn" id="installBtn" title="تثبيت التطبيق" aria-label="تثبيت التطبيق"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 21h16"/></svg></button>
    <nav class="links" id="navLinks">
      <a class="tab" href="index.html">الرئيسية</a>
      <div class="drop">
        <a class="tab" href="phase1.html">المرحلة الأولى</a><button class="caret" type="button" aria-label="القائمة الفرعية">▾</button>
        <div class="drop-menu">
          <a href="الملحق.html">ملحق تنفيذي للمرحلة الأولى</a>
          <a href="الحزمة التنفيذية.html">الحزمة التنفيذية</a>
        </div>
      </div>
      <a class="tab" href="phase2.html">المرحلة الثانية</a>
      <a class="tab" href="phase3.html">المرحلة الثالثة</a>
      <a class="tab active" href="phase4.html">المرحلة الرابعة</a>
    </nav>
  </div>
</header>
<main class="container">
  <div class="hero-compact">
    <h1>مبادرة نقلة ذكية</h1>
    <p class="p1">المرحلة الرابعة</p>
    <p class="p2">المختبر الرقمي</p>
  </div>
  <div class="card">
    <h2>المرحلة الرابعة: المختبر الرقمي</h2>
    <p>سيرفق لاحقاً</p>
  </div>
</main>
<footer>مقترح مبادرة نقلة ذكية</footer>
<button id="toTop" title="العودة إلى الأعلى" aria-label="العودة إلى الأعلى">↑</button>
<script>
var toTop = document.getElementById('toTop');
var progress = document.getElementById('progressBar');
window.addEventListener('scroll', function(){
  var y = window.scrollY || document.documentElement.scrollTop;
  if (y > 400) { toTop.classList.add('show'); } else { toTop.classList.remove('show'); }
  var h = document.documentElement.scrollHeight - window.innerHeight;
  progress.style.width = (h > 0 ? (y / h) * 100 : 0) + '%';
}, {passive:true});
toTop.addEventListener('click', function(){ window.scrollTo({top:0, behavior:'smooth'}); });
var menuBtn = document.getElementById('menuBtn');
var navLinks = document.getElementById('navLinks');
menuBtn.addEventListener('click', function(){ navLinks.classList.toggle('open'); });
var carets = document.querySelectorAll('.drop .caret');
for(var ci=0;ci<carets.length;ci++){
  carets[ci].addEventListener('click', function(ev){
    ev.stopPropagation();
    this.parentElement.classList.toggle('open');
  });
}
document.addEventListener('click', function(){
  var drops = document.querySelectorAll('.drop.open');
  for(var di=0;di<drops.length;di++){ drops[di].classList.remove('open'); }
});

</script>
<script>
if('serviceWorker' in navigator && location.protocol.indexOf('http') === 0 && window.self === window.top){
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js'); });
}
</script>
<script src="install.js" defer></script>
</body>
</html>
